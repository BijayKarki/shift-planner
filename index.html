<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Rotation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --l1: #dbeafe;
    --l2: #dcfce7;
    --l3: #fef3c7;
    --other: #f3f4f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .status { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }

  .lane-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .lane-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .lane-card .label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .lane-card .names { font-size: 1.05rem; font-weight: 600; line-height: 1.4; }
  .lane-card.L1 { border-top: 4px solid #3b82f6; }
  .lane-card.L2 { border-top: 4px solid #22c55e; }
  .lane-card.L3 { border-top: 4px solid #f59e0b; }
  .lane-card.Other { border-top: 4px solid #9ca3af; }

  h2 { font-size: 1.05rem; margin: 32px 0 12px; }
  .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--card-bg); }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; min-width: 560px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  tr:first-child td { background: #eff6ff; font-weight: 600; }

  .search {
    margin: 16px 0;
  }
  .search input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 14px;
    border-radius: 10px;
    font-size: 0.9rem;
  }
  .error code { background: #fee2e2; padding: 2px 5px; border-radius: 4px; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card-bg: #1a1d23;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #2a2e37;
    }
    tr:first-child td { background: #1e293b; }
    .error { background: #2a1414; border-color: #5c1f1f; color: #fca5a5; }
    .error code { background: #3a1a1a; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Robot Line Rotation</h1>
    <div class="subtitle" id="subtitle">Who's where this week</div>
    <div id="content">Loading…</div>
  </div>

<script>
  // ---- CONFIGURE THIS ----
  // Google Sheet > File > Share > Publish to web > choose the "History" tab > CSV > Publish
  // Paste the resulting link below.
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTLw8Cj-Kp9FioGksVkZLVkMSRGrUCFQOU3eFfIqKR4UylDHnUjdKPikB0OvulL0w6ffdEQNHjQpPS6/pubhtml?gid=1485801565&single=true";
  // -------------------------

  const content = document.getElementById('content');
  const subtitle = document.getElementById('subtitle');

  function renderError(msg) {
    content.innerHTML = `<div class="error">Couldn't load the schedule.<br>${msg}</div>`;
  }

  function renderData(rows) {
    // rows: array of objects with keys Week, Date, L1, L2_1, L2_2, L3_1, L3_2, Other
    if (!rows.length) {
      renderError('No history rows found yet. Run "Generate Next Week" in the Sheet first.');
      return;
    }
    const latest = rows[rows.length - 1];
    subtitle.textContent = 'Week ' + latest.Week + (latest.Date ? ' · ' + latest.Date : '');

    const lanes = [
      { label: 'L1', cls: 'L1', names: [latest.L1] },
      { label: 'L2', cls: 'L2', names: [latest.L2_1, latest.L2_2] },
      { label: 'L3', cls: 'L3', names: [latest.L3_1, latest.L3_2] },
      { label: 'Other', cls: 'Other', names: (latest.Other || '').split(',').map(s => s.trim()).filter(Boolean) },
    ];

    const laneHtml = lanes.map(l => `
      <div class="lane-card ${l.cls}">
        <div class="label">${l.label}</div>
        <div class="names">${l.names.filter(Boolean).join('<br>') || '&mdash;'}</div>
      </div>
    `).join('');

    const historyRowsHtml = rows.slice().reverse().map(r => `
      <tr>
        <td>${r.Week}</td>
        <td>${r.Date || ''}</td>
        <td>${r.L1 || ''}</td>
        <td>${r.L2_1 || ''}</td>
        <td>${r.L2_2 || ''}</td>
        <td>${r.L3_1 || ''}</td>
        <td>${r.L3_2 || ''}</td>
        <td>${r.Other || ''}</td>
      </tr>
    `).join('');

    content.innerHTML = `
      <div class="lane-grid">${laneHtml}</div>
      <h2>History</h2>
      <div class="search">
        <input type="text" id="searchBox" placeholder="Filter by name…">
      </div>
      <div class="table-scroll">
        <table id="historyTable">
          <thead>
            <tr><th>Week</th><th>Date</th><th>L1</th><th>L2</th><th>L2</th><th>L3</th><th>L3</th><th>Other</th></tr>
          </thead>
          <tbody>${historyRowsHtml}</tbody>
        </table>
      </div>
    `;

    document.getElementById('searchBox').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('#historyTable tbody tr').forEach(tr => {
        tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    });
  }

  function load() {
    if (!CSV_URL || CSV_URL.indexOf('PASTE_YOUR') === 0) {
      renderError('Set <code>CSV_URL</code> at the top of the script to your published Google Sheet CSV link.');
      return;
    }
    fetch(CSV_URL, { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(text => {
        // Strip a leading BOM if present — Google's CSV export sometimes
        // adds one, which otherwise breaks the first column's header key.
        const clean = text.replace(/^\uFEFF/, '');
        const parsed = Papa.parse(clean, {
          header: true,
          skipEmptyLines: true,
          transformHeader: h => h.trim()
        });
        // Drop any row where every field is empty (stray trailing rows)
        const rows = parsed.data.filter(r =>
          Object.values(r).some(v => (v || '').toString().trim() !== '')
        );
        if (parsed.errors && parsed.errors.length) {
          console.warn('CSV parse warnings:', parsed.errors);
        }
        renderData(rows);
      })
      .catch(err => renderError(err.message + ' — check the CSV_URL is public ("Anyone with the link").'));
  }

  load();
</script>
</body>
</html>
